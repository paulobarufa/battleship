<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
<script defer src="main.js"></script></head>
<body>
    <div class="header">
        <h1 class="header-text">Maulo's Battleships</h1>
    </div>
    <div class="main-content">
        <div class="game-wrapper">
            <div class="player-wrapper">
                <div class="player-stats">
                    <h2 class="stats-title">Status</h2>
                    <div class="confirm">Start Game</div>
                    <div class="stats-container"></div>
                </div>
                <div class="player-board"></div>
                <div class="board-label">Your board</div>
            </div>
            <div class="computer-wrapper">
                <div class="computer-board"></div>
                    <div class="computer-stats">
                        <h2 class="stats-title">Status</h2>
                        <div class="stats-container"></div>
                    </div>
                <div class="board-label">Opponent's board</div>
            </div>
        </div>
        <div class="log-wrapper">
            <h4 class="log-title">Chat log</h4>
            <div class="log"></div>
        </div>
    </div>
    <div class="footer">
        <p class="footer-text">Maulo Patos enterprises &copy; 2025</p>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <p class="modal-text">Congratulations! You won!</p>
            <div class="restart">Play again</div>
        </div>
    </div>
</body>
</html>
